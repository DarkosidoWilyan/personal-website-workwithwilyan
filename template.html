<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{player.name}} — {{player.class}}</title>
  <meta name="description" content="{{meta.description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
  <script id="quest-data" type="application/json">{{questsJson}}</script>
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="scroll-area">

    <header class="header">
      <div class="panel panel--header header__inner">
        <canvas class="header__avatar" id="avatar-canvas" width="104" height="104" aria-hidden="true"></canvas>
        <div class="header__copy">
          <div class="header__top">
            <h1 class="header__name">{{player.name}}</h1>
            <span class="header__class">{{player.class}}</span>
          </div>
          <!-- @optional:player.tagline -->
          <p class="header__tagline">{{player.tagline}}</p>
          <!-- /@optional:player.tagline -->
        </div>
      </div>
    </header>

    <main>
      <section class="quest-menu" id="quest-menu">
        <h2 class="quest-menu__title">Quest Log</h2>
        <ul class="quest-menu__list" id="menu-list"></ul>
      </section>
    </main>

    <footer class="footer" id="contact">
      <h2 class="block__h">Signboard</h2>

      <!-- @section:contact -->
      <div class="panel panel--sign">
        <ul class="sign">
          <!-- @items:contact -->
        </ul>
      </div>
      <!-- /@section:contact -->

      <p class="colophon">Hand-written HTML &amp; CSS · one Node build step · no framework.<br>
      &copy; {{year}} {{player.name}} — all rights reserved.</p>
    </footer>

  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <button class="overlay__close" id="overlay-close" aria-label="Close quest">&#10005;</button>
    <div class="overlay__stage">
      <canvas id="scroll-canvas" width="128" height="128"></canvas>
      <div class="overlay__parchment" id="overlay-content">
        <h3 class="overlay__title" id="o-title"></h3>
        <p class="overlay__era" id="o-era"></p>
        <p class="overlay__objective" id="o-objective"></p>
        <dl class="overlay__star" id="o-star" hidden>
          <div>
            <dt>Situation</dt>
            <dd id="o-situation"></dd>
          </div>
          <div>
            <dt>Task</dt>
            <dd id="o-task"></dd>
          </div>
          <div>
            <dt>Action</dt>
            <dd id="o-action"></dd>
          </div>
          <div>
            <dt>Result</dt>
            <dd id="o-result"></dd>
          </div>
        </dl>
        <dl class="overlay__meta">
          <div>
            <dt>Party</dt>
            <dd id="o-party"></dd>
          </div>
          <div>
            <dt>Loot</dt>
            <dd><ul class="tags" id="o-tags"></ul></dd>
          </div>
          <div>
            <dt>XP</dt>
            <dd class="overlay__xp" id="o-xp"></dd>
          </div>
        </dl>
      </div>
    </div>
  </div>

</body>
</html>
